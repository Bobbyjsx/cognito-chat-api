name: CI - Lint & Test

on:
  pull_request:
    branches:
      - master
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Style
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Check Code Formatting
        run: |
          ruff format --check .

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Firestore Emulator
        run: |
          docker compose up -d firestore
          echo "Waiting for Firestore emulator to become healthy..."
          timeout 60s bash -c 'until curl -s http://127.0.0.1:8080/ > /dev/null; do sleep 1; done'
          echo "Firestore emulator is up and running!"

      - name: Run Pytest
        env:
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"
          GOOGLE_CLOUD_PROJECT: "test-project"
          FIRESTORE_DATABASE: "(default)"
          STORAGE_BACKEND: "local"
          PYTHONPATH: "."
        run: |
          pytest -v tests/

      - name: Verify Migration Idempotency
        env:
          FIRESTORE_EMULATOR_HOST: "127.0.0.1:8080"
          GOOGLE_CLOUD_PROJECT: "test-project"
          PYTHONPATH: "."
        run: |
          python scripts/migrate.py --list
          python scripts/migrate.py all

      - name: Teardown Services
        if: always()
        run: |
          docker compose down
