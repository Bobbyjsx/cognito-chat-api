name: CD - Database Migrations & Indexes

on:
  push:
    branches:
      - master
    paths:
      - 'scripts/migrations/**'
      - 'scripts/migrate.py'
      - 'scripts/deploy_indexes.py'
      - 'firestore.indexes.json'
  workflow_dispatch:
    inputs:
      feature:
        description: 'Specific feature migration to run (default: "all", "none" to skip)'
        required: false
        default: 'all'
      deploy_indexes:
        description: 'Deploy Firestore composite indexes'
        type: boolean
        required: false
        default: true

concurrency:
  group: cd-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Run Database Migrations & Indexes
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            indexes:
              - 'firestore.indexes.json'
              - 'scripts/deploy_indexes.py'
            migrations:
              - 'scripts/migrations/**'
              - 'scripts/migrate.py'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Set up Environment
        run: |
          cp -n .env.example .env || true

      - name: Configure Firebase / GCP Credentials
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS || secrets.GCP_SA_KEY || secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          FIREBASE_CREDENTIALS_BASE64: ${{ secrets.FIREBASE_CREDENTIALS_BASE64 }}
        run: |
          if [ -n "$FIREBASE_CREDENTIALS" ]; then
            echo "$FIREBASE_CREDENTIALS" > firebase-credentials.json
            chmod 600 firebase-credentials.json
            echo "FIREBASE_CREDENTIALS_PATH=firebase-credentials.json" >> $GITHUB_ENV
            echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/firebase-credentials.json" >> $GITHUB_ENV
            echo "Successfully configured credentials from secret."
          elif [ -n "$FIREBASE_CREDENTIALS_BASE64" ]; then
            echo "$FIREBASE_CREDENTIALS_BASE64" | base64 -d > firebase-credentials.json
            chmod 600 firebase-credentials.json
            echo "FIREBASE_CREDENTIALS_PATH=firebase-credentials.json" >> $GITHUB_ENV
            echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/firebase-credentials.json" >> $GITHUB_ENV
            echo "Successfully configured base64 credentials from secret."
          else
            echo "Warning: No Firebase credentials secret found. Relying on default GCP environment."
          fi

      - name: Deploy Firestore Composite Indexes
        if: steps.filter.outputs.indexes == 'true' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.deploy_indexes == 'true' || github.event.inputs.deploy_indexes == true))
        env:
          PYTHONPATH: "."
          FIRESTORE_DATABASE: ${{ secrets.FIRESTORE_DATABASE || 'cognito-prod-db' }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT || 'project-atlas-501612' }}
        run: |
          echo "Deploying Firestore composite indexes..."
          uv run python scripts/deploy_indexes.py

      - name: Execute Migrations
        if: steps.filter.outputs.migrations == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.feature != 'none')
        env:
          PYTHONPATH: "."
          FIRESTORE_DATABASE: ${{ secrets.FIRESTORE_DATABASE || 'cognito-prod-db' }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT || 'project-atlas-501612' }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          FEATURE="${{ github.event.inputs.feature || 'all' }}"
          echo "Running database migrations for: $FEATURE"
          uv run python scripts/migrate.py "$FEATURE"

      - name: Secure Cleanup
        if: always()
        run: |
          rm -f firebase-credentials.json
