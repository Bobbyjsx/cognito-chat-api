repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: local
    hooks:
      - id: make-lint-fix
        name: make-lint-fix
        entry: make lint-fix
        language: system
        pass_filenames: false
      - id: make-lint
        name: make-lint
        entry: make lint
        language: system
        pass_filenames: false
